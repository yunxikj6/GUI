<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f7fa">
  <title>云端工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="app-mark" aria-hidden="true"></span><h1>云端工作台</h1></div>
    <span class="top-divider"></span>
    <span class="top-project" id="topProject">项目</span>
    <div class="connection" id="connection" data-state="loading" role="status"><i></i><span id="connectionLabel">连接中</span></div>
    <button class="square refresh" id="refresh" title="刷新工作区" aria-label="刷新工作区"><span aria-hidden="true">↻</span></button>
    <a class="desktop-link" href="/desktop/" target="_blank" rel="noopener"><i class="monitor" aria-hidden="true"></i>Linux 桌面<span aria-hidden="true">↗</span></a>
  </header>
  <nav class="mobile-switch" aria-label="面板切换">
    <button id="mobileFiles" aria-pressed="true">项目</button><button id="mobileTasks" aria-pressed="false">任务</button>
  </nav>
  <div class="workbench" id="workbench" data-mobile="files">
    <aside class="sidebar" aria-label="项目导航">
      <div class="section-heading"><span class="eyebrow">工作区</span></div>
      <nav class="views" aria-label="查看方式">
        <button id="showFiles" class="nav-button selected" aria-pressed="true"><i class="icon folder-icon" aria-hidden="true"></i>项目文件</button>
        <button id="showDiff" class="nav-button" aria-pressed="false"><i class="icon diff-icon" aria-hidden="true">±</i>Git 差异</button>
      </nav>
      <div class="tree-heading"><span class="eyebrow">文件目录</span><button class="square small" id="reloadTree" aria-label="刷新文件目录" title="刷新文件目录">↻</button></div>
      <div class="tree-column"><div id="tree" aria-label="文件目录"></div><p id="treeNotice" class="inline-note" role="status">正在读取目录…</p></div>
      <div class="branch-row"><span class="branch-icon" aria-hidden="true">⑂</span><span id="branch">分支待连接</span></div>
    </aside>
    <main class="editor" aria-label="文件与差异预览">
      <div class="editor-top"><span class="mini-tab"><i class="icon doc-icon" aria-hidden="true"></i><span id="editorTab">文件预览</span></span></div>
      <div class="editor-head"><div class="title-line"><span class="eyebrow" id="viewLabel">文件预览</span><span class="file-info"><span class="file-sync" id="fileSync" role="status"></span><span class="file-size" id="fileSize"></span></span></div><h2 id="fileTitle">项目文件</h2><div class="file-path" id="filePath"></div></div>
      <div class="edit-bar" id="editBar" hidden><span id="editState" role="status"></span><button id="editFile" class="subtle-button">编辑文件</button><button id="cancelEdit" class="subtle-button" hidden>放弃编辑</button><button id="saveFile" class="primary" hidden>保存</button></div>
      <textarea id="fileEditArea" aria-label="编辑文件内容" wrap="off" spellcheck="false" hidden></textarea>
      <p class="preview-note" id="fileNotice" role="status">正在连接云端工作区…</p>
      <div id="preview" class="preview" tabindex="0" aria-label="内容"></div>
    </main>
    <aside class="task-pane" aria-label="云端任务">
      <div class="task-top"><span class="terminal-mark" aria-hidden="true">&gt;_</span><h2>云端任务</h2></div>
      <section class="compose">
        <div class="control-line"><label for="provider">编码助手 · 只读</label><select id="provider"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></div>
        <textarea id="prompt" maxlength="8000" aria-label="任务要求" placeholder="询问项目代码，或请助手审阅改动…" rows="4"></textarea>
        <div class="compose-actions"><span class="hint" id="providerHint"></span><button id="runAgent" class="primary" disabled>运行任务 <span aria-hidden="true">↗</span></button></div>
        <div id="pendingWrap" class="pending" hidden><p id="pendingMessage"></p><button id="retryStart" class="subtle-button">重试提交</button> <button id="dismissPending" class="subtle-button">清除重试</button></div>
        <p id="startNotice" class="action-note" role="status"></p>
        <button class="check-button" id="runCheck" disabled><i class="check-icon" aria-hidden="true">✓</i>项目检查<span class="check-end" aria-hidden="true">→</span></button>
      </section>
      <section class="activity">
        <div class="activity-heading"><h3>任务记录</h3><button class="square small" id="reloadTasks" aria-label="刷新任务记录" title="刷新任务记录">↻</button></div>
        <label class="sr-only" for="taskHistory">选择任务</label><select id="taskHistory" disabled><option value="">暂无任务</option></select>
        <div class="event-heading" id="eventHeading" hidden><span id="eventProvider"></span><span id="taskStatus" class="status-tag"></span></div>
        <details id="taskRequest" class="task-request" hidden><summary>任务要求</summary><div id="taskRequestText"></div></details>
        <div class="event-log" id="eventLog" tabindex="0" aria-label="任务输出"></div>
        <p class="inline-note activity-note" id="taskNotice" role="status">加载任务记录…</p>
      </section>
    </aside>
  </div>
</body>
</html>
